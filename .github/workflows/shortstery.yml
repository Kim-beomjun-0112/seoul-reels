name: shortstery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['shortstery/queue.json', 'shortstery/enabled.txt', '.github/workflows/shortstery.yml']
  schedule:
    - cron: "7,22,37,52 * * * *"
concurrency:
  group: shortstery
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 인스타 릴스 + 스레드 게시
        env:
          SHORTSTERY_IG_TOKEN: ${{ secrets.SHORTSTERY_IG_TOKEN }}
          SHORTSTERY_TH_TOKEN: ${{ secrets.SHORTSTERY_TH_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 shortstery/post.py --run
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "shortstery-bot"
          git config user.email "shortstery-bot@users.noreply.github.com"
          git add shortstery/state.json
          git diff --cached --quiet || { git commit -m "숏스터리 게시 기록"; git pull --rebase -q; git push; }
